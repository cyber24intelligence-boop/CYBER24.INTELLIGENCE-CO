<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fadeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8A8A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8A8A8A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8A8A8A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="1" fill="url(#fadeEdge)"/>
  <rect x="-160" y="4.5" width="160" height="2" fill="url(#glint)">
    <animate attributeName="x" from="-160" to="1000" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
