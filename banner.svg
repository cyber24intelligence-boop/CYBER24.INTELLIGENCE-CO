<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="CYBER24 - Intelligent Technology. Security-Driven Innovation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; text-anchor: middle; }
      .name { font-size: 66px; font-weight: 600; letter-spacing: 16px; fill: #FFFFFF; opacity: 0; animation: rise 1.4s ease-out 0.2s forwards; }
      .tag { font-size: 17px; font-weight: 400; letter-spacing: 3px; fill: #9A9A9A; opacity: 0; animation: fade 1.6s ease-out 1.4s forwards; }
      .status { font-size: 11px; letter-spacing: 4px; fill: #6F6F6F; opacity: 0; animation: fade 1.6s ease-out 2.2s forwards; }
      .rule { fill: #8A8A8A; transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: grow 1.4s ease-out 0.9s forwards; }
      .dot { fill: #FFFFFF; animation: pulse 2.4s ease-in-out 2.4s infinite; opacity: 0; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; animation-delay: 0s !important; } }
    </style>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>
  <rect x="-240" y="0" width="240" height="260" fill="url(#scan)">
    <animate attributeName="x" from="-240" to="1000" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text class="t name" x="508" y="128">CYBER24</text>
  <rect class="rule" x="410" y="152" width="180" height="2"/>
  <text class="t tag" x="500" y="190">INTELLIGENT TECHNOLOGY. SECURITY-DRIVEN INNOVATION.</text>
  <circle class="dot" cx="372" cy="228" r="3"/>
  <text class="t status" x="512" y="232">EARLY-STAGE DEVELOPMENT</text>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
